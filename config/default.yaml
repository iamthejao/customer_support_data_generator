pipeline:
  version: "0.3.0"
  run_seed: 42
  budget:
    max_tokens_per_run: 5000000
    max_usd_per_run: 10.0
    max_retries_per_artifact: 2

# Two agent buckets drive every LLM call in the pipeline:
#   - generator         : problem brainstorm + resolution generator
#   - combined_checker  : phase 1 + phase 2 quality checkers
# Node-name fallbacks in `csfd.agents.factory._ROLE_FALLBACK` route specific
# node names (e.g. resolution_generator, combined_problem_check) to these
# buckets.
agents:
  generator:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.85
    max_tokens: 4096
    timeout_s: 60
  combined_checker:
    provider: anthropic
    model: claude-haiku-4-5
    temperature: 0.1
    max_tokens: 1024
    timeout_s: 30

problem_database:
  count: 10
  complexity_proportions:
    simple: 0.6
    medium: 0.3
    complex: 0.1

tickets:
  total: 100
  type_proportions:
    docs_request: 0.50
    l1:           0.30
    l2:           0.10
    l3:           0.10
  assignment_strategy: complexity_weighted   # or "uniform"
  dialogue:
    turn_cap: 20
  tier_proportions:
    standard:   0.6
    premium:    0.3
    enterprise: 0.1
  tone_proportions_per_type:
    docs_request: { neutral: 0.7, polite: 0.3 }
    l1:           { neutral: 0.5, frustrated: 0.3, polite: 0.2 }
    l2:           { frustrated: 0.5, urgent: 0.3, neutral: 0.2 }
    l3:           { urgent: 0.4, frustrated: 0.4, neutral: 0.2 }
  # Conversation / output format (CLI: --channel):
  #   email — written tickets (subject + body, then written replies)
  #   phone — spoken call transcripts: scripted agent greeting, verification,
  #           troubleshooting, closing; per-utterance timestamps estimated at commit.
  channel: email
  phone:
    disfluency: light      # none | light | moderate (CLI: --disfluency)
  # Deterministic contact times: seeded weekday, in-hours slots starting here.
  # Never taken from the wall clock, so the same seed yields the same times.
  calendar:
    start: "2026-01-05T08:00:00+00:00"
    span_days: 20          # business days over which first contacts are spread
    business_hours: [8, 18]
  # Multi-contact cases (CLI: --rounds N). tickets.total counts cases; a case
  # with N rounds yields N related contacts (e.g. a caller who calls back) that
  # share a case id. Rounds 1..N-1 end without closing the case, round N concludes it.
  rounds:
    proportions: {1: 1.0}  # contacts per case, e.g. {1: 0.6, 2: 0.3, 3: 0.1}
    callback_reasons:      # why a non-final contact ends
      follow_up: 0.7       #   an agreed next step that needs time (test, part, visit)
      dropped: 0.3         #   the call cuts off mid-conversation
    gap_hours: [2, 72]     # hours between contact starts (log-uniform, moved into business hours)

validation:
  enabled: true
  max_retries: 2

observability:
  structlog_json: true
  langsmith_enabled: false
  langsmith_project: csfd
  persist_stream_updates: true

storage:
  sqlite_path: "data/runs.sqlite"
  exports_dir: "data/exports"
  exports_format: ["jsonl", "parquet"]

embedding:
  enabled: true
  provider: openai_compat
  base_url: http://localhost:11434/v1
  model: embeddinggemma:300m
  dim: 768
  threshold: 0.8
  text_template: title_summary
  timeout_s: 30

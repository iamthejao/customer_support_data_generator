pipeline:
  version: "0.4.0"
  run_seed: 42
  budget:
    max_tokens_per_run: 5000000
    max_usd_per_run: 10.0
    max_retries_per_artifact: 2

# Company seed (CLI: --company): seeds/<company>/company_seed.md + scenarios_seed.md.
# Shipped: kalvora (dental equipment and materials), norrholt (glass-container forming).
seeds:
  dir: seeds
  company: kalvora

# Two agent buckets drive every LLM call in the pipeline:
#   - generator         : problems, customer openings, and both dialogue speakers
#   - combined_checker  : Phase 1 problem check + Phase 2 conversation consistency check
# `csfd.agents.factory._ROLE_FALLBACK` maps each node name (e.g. agent_turn_generator,
# conversation_consistency_check) to one of these buckets.
agents:
  generator:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.85
    max_tokens: 4096
    timeout_s: 60
  combined_checker:
    provider: anthropic
    model: claude-haiku-4-5
    temperature: 0.1
    max_tokens: 1024
    timeout_s: 30

problem_database:
  count: 10
  complexity_proportions:
    simple: 0.6
    medium: 0.3
    complex: 0.1

tickets:
  total: 100
  type_proportions:
    docs_request: 0.50
    l1:           0.30
    l2:           0.10
    l3:           0.10
  assignment_strategy: complexity_weighted   # or "uniform"
  dialogue:
    turn_cap: 20
  tier_proportions:
    standard:   0.6
    premium:    0.3
    enterprise: 0.1
  tone_proportions_per_type:
    docs_request: { neutral: 0.7, polite: 0.3 }
    l1:           { neutral: 0.5, frustrated: 0.3, polite: 0.2 }
    l2:           { frustrated: 0.5, urgent: 0.3, neutral: 0.2 }
    l3:           { urgent: 0.4, frustrated: 0.4, neutral: 0.2 }
  # The state each case is planned to end in, drawn within the outcomes its problem
  # allows (Phase 1's viable_outcomes); the consistency check verifies the dialogue
  # reached it. `resolved` is derived: true only for fixed_*.
  outcome_proportions:
    fixed_verified:        0.35   # fixed, and the customer confirmed it works
    fixed_unverified:      0.15   # fix applied, confirmation still to come
    workaround:            0.10   # customer can work, cause not removed
    pending_visit:         0.10   # technician visit booked
    pending_part:          0.10   # spare or swap unit on its way
    pending_customer_test: 0.05   # customer runs a check and reports back
    escalated_open:        0.05   # handed to a higher tier, still open
    not_a_fault:           0.05   # works as designed (handling, settings, expectations)
    abandoned:             0.05   # customer gave up before it was solved
  # Conversation / output format (CLI: --channel):
  #   email — written tickets (subject + body, then written replies)
  #   phone — spoken call transcripts: scripted agent greeting, verification,
  #           troubleshooting, closing; per-utterance timestamps estimated at commit.
  channel: email
  phone:
    disfluency: light      # none | light | moderate (CLI: --disfluency)
  # Deterministic contact times: seeded weekday, in-hours slots starting here.
  # Never taken from the wall clock, so the same seed yields the same times.
  calendar:
    start: "2026-01-05T08:00:00+00:00"
    span_days: 20          # business days over which first contacts are spread
    business_hours: [8, 18]
  # Multi-contact cases (CLI: --rounds N). tickets.total counts cases; a case
  # with N rounds yields N related contacts (e.g. a caller who calls back) that
  # share a case id. Rounds 1..N-1 end without closing the case, round N concludes it.
  rounds:
    proportions: {1: 1.0}  # contacts per case, e.g. {1: 0.6, 2: 0.3, 3: 0.1}
    callback_reasons:      # why a non-final contact ends
      follow_up: 0.7       #   an agreed next step that needs time (test, part, visit)
      dropped: 0.3         #   the call cuts off mid-conversation
    gap_hours: [2, 72]     # hours between contact starts (log-uniform, moved into business hours)

validation:
  enabled: true
  max_retries: 2

observability:
  structlog_json: true
  langsmith_enabled: false
  langsmith_project: csfd
  persist_stream_updates: true

storage:
  sqlite_path: "data/runs.sqlite"
  exports_dir: "data/exports"
  exports_format: ["jsonl", "parquet"]
  # Text layout of `csfd export --format transcripts` (CLI: --speaker-style, --header-style).
  transcripts:
    speaker_style: upper   # upper (AGENT:) | title (Agent:) | role (Agent: / Caller (<job role>):)
    header_style: csfd     # csfd (full key: value header) | wissant (call_id/call_date + ---) | none

# Phase 1 near-duplicate rejection: a problem whose embedding has cosine >= threshold
# to one already committed in the run is regenerated. Needs an OpenAI-compatible
# embeddings endpoint (local Ollama by default); set enabled: false without one.
embedding:
  enabled: true
  provider: openai_compat
  base_url: http://localhost:11434/v1
  model: embeddinggemma:300m
  dim: 768
  threshold: 0.8
  text_template: title_summary
  timeout_s: 30

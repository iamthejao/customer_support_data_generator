# Route both agent roles through the local `claude` CLI (subscription auth),
# not the Anthropic API. Requires the `claude` binary on $PATH and a
# logged-in session (run `claude /login` once).
# Inherits embedding.enabled: true from default.yaml, so Phase 1 dedup needs a
# local Ollama; add `embedding: {enabled: false}` here to run without one.
agents:
  generator:
    provider: claude_code_cli
    model: claude-sonnet-4-5
    temperature: 0.85
    timeout_s: 180
  combined_checker:
    provider: claude_code_cli
    model: claude-haiku-4-5
    temperature: 0.1
    # The consistency check reads and may rewrite a whole multi-turn transcript.
    timeout_s: 300

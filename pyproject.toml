[project]
name = "csfd"
version = "0.1.0"
description = "Customer Service Fake Data — synthetic CS ticket generator for benchmarking"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Joao Augusto" }]

dependencies = [
    "pydantic~=2.7",
    "pydantic-settings~=2.3",
    "pyyaml~=6.0",
    "jinja2~=3.1",
    "structlog~=24.1",
    "tenacity~=8.3",
    "pybreaker~=1.2",
    "pyarrow~=16.1",
    "typer~=0.12",
    "rich~=13.7",
    "langchain-core~=0.2",
    "langchain-anthropic~=0.1",
    "langchain-openai~=0.1",
    "langgraph~=0.1",
    "langgraph-checkpoint-sqlite~=1.0",
]

[project.scripts]
csfd = "csfd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csfd"]

[tool.uv]
dev-dependencies = [
    "pytest~=8.2",
    "pytest-recording~=0.13",
    "pytest-asyncio~=0.23",
    "ruff~=0.5",
    "mypy~=1.10",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "ASYNC"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_decorators = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_llm: tests that hit real LLM APIs (gated; not run on PR)",
]
